worker_processes  1;

error_log  logs/error.log debug;

events {
    worker_connections  1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

           application scene1 {
                        live on;
                        # --- HLS ---
                        hls on;
                        hls_path C:/nginx/hls/scene1/;
                        hls_fragment 4s;            # Durée d’un fragment
                        hls_playlist_length 12s;    # Durée totale conservée -> 6 fragments
                        hls_cleanup on;             # Nettoyage auto des vieux .ts 
                        }
           application scene2 {
                        live on;
                        # --- HLS ---
                        hls on;
                        hls_path C:/nginx/hls/scene2/;
                        hls_fragment 4s;            # Durée d’un fragment
                        hls_playlist_length 12s;    # Durée totale conservée -> 6 fragments
                        hls_cleanup on;             # Nettoyage auto des vieux .ts 
                        }
    }
}

http {
    server {
        listen      8080;
		
        location / {
            root html;
        }
		
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root html;
        }
		
location /hls {
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
        }
        add_header Cache-Control no-cache;
        alias C:/nginx/hls/;
        expires -1;
        }
    }
}
